[package]
name = "browser-tls-rustls"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["std"] }
rustls-rustcrypto = "0.0.2-alpha"
# `web` makes `UnixTime::now()` read the browser clock; without it rustls
# cannot build for wasm32-unknown-unknown.
rustls-pki-types = { version = "1", features = ["web"] }
wasm-bindgen = "=0.2.120"
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = "debuginfo"
