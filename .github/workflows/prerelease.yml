name: Prerelease

on:
  push:
    branches:
      # main mirrors dev (fast-forward), so publishing from it would always
      # collide with the canary the dev push already published (E403
      # cannot-publish-over). Canary comes from dev only.
      - develop
      - dev
      - "feat/*"

# One canary publish per ref: concurrent pushes raced on the same version (E403).
concurrency:
  group: canary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-prerelease:
    name: Publish Canary
    # Branches stacked on feat/stream-sync are unmerged PR heads; publishing
    # them moved `canary` to unreviewed code. feat/stream-sync itself, develop,
    # dev and every other feat/* branch still publish as before.
    if: ${{ !startsWith(github.ref, 'refs/heads/feat/stream-sync-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
      - name: Set canary version
        run: |
          BASE_VERSION=$(node -p "require('./packages/cli/package.json').version")
          SHORT_SHA=$(git rev-parse --short HEAD)
          CANARY_VERSION="${BASE_VERSION}-canary.${SHORT_SHA}"
          echo "CANARY_VERSION=${CANARY_VERSION}" >> "$GITHUB_ENV"
          CANARY_VERSION="$CANARY_VERSION" node - <<'EOF'
          const fs = require("node:fs");

          const canaryVersion = process.env.CANARY_VERSION;
          const packageFiles = [
            "packages/stream-sync/package.json",
            "packages/core/package.json",
            "packages/lite/package.json",
            "packages/server/package.json",
            "packages/cli/package.json",
          ];
          const internalDependency =
            /^@opendatalabs\/personal-server-ts(-|$)/;

          // Every internal dependency is pinned to the canary: a `*` range
          // never matches a prerelease, so an unpinned one cannot install.
          for (const path of packageFiles) {
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
            pkg.version = canaryVersion;

            for (const field of ["dependencies", "peerDependencies"]) {
              for (const name of Object.keys(pkg[field] ?? {})) {
                if (internalDependency.test(name)) {
                  pkg[field][name] = canaryVersion;
                }
              }
            }

            fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          }
          EOF
      - name: Publish stream-sync canary
        run: cd packages/stream-sync && npm publish --tag canary --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish core canary
        run: cd packages/core && npm publish --tag canary --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish lite canary
        run: cd packages/lite && npm publish --tag canary --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish server canary
        run: cd packages/server && npm publish --tag canary --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish facade canary
        run: cd packages/cli && npm publish --tag canary --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
