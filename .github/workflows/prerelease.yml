name: Prerelease

on:
  push:
    branches:
      # main mirrors dev (fast-forward), so publishing from it would always
      # collide with the canary the dev push already published (E403
      # cannot-publish-over). Canary comes from dev only.
      - develop
      - dev
      - "feat/*"

jobs:
  publish-prerelease:
    name: Publish Canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The canary version is derived from the newest v-tag, and the
          # default shallow clone fetches none, so `git describe` silently
          # falls back and every canary publishes as 0.0.1.
          fetch-tags: true
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Same suite as CI — see .github/actions/setup-sandbox.
      - uses: ./.github/actions/setup-sandbox
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
      - name: Set canary version
        run: |
          # The in-repo package.json versions are all 0.0.1: semantic-release
          # computes the real version from git tags at publish time and never
          # writes it back. Deriving the canary base from the file therefore
          # produced 0.0.1-canary.<sha>, which sorts *below* every released
          # version, so `npm install @canary` worked but no semver range could
          # ever resolve it. Take the newest tag instead and bump the patch, so
          # the canary sits above the last release and below the next one.
          LATEST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "v0.0.0")
          BASE_VERSION=$(node -p "
            const [maj, min, pat] = process.argv[1].replace(/^v/, '').split('.').map(Number);
            [maj, min, pat + 1].join('.')
          " "$LATEST_TAG")
          SHORT_SHA=$(git rev-parse --short HEAD)
          CANARY_VERSION="${BASE_VERSION}-canary.${SHORT_SHA}"
          echo "CANARY_VERSION=${CANARY_VERSION}" >> "$GITHUB_ENV"
          CANARY_VERSION="$CANARY_VERSION" node - <<'EOF'
          const fs = require("node:fs");

          const canaryVersion = process.env.CANARY_VERSION;
          const packageFiles = [
            "packages/core/package.json",
            "packages/lite/package.json",
            "packages/server/package.json",
            "packages/cli/package.json",
          ];

          for (const path of packageFiles) {
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
            pkg.version = canaryVersion;

            if (path === "packages/server/package.json") {
              pkg.dependencies["@opendatalabs/personal-server-ts-core"] =
                canaryVersion;
              pkg.dependencies["@opendatalabs/personal-server-ts-lite"] =
                canaryVersion;
            }

            if (path === "packages/lite/package.json") {
              pkg.dependencies["@opendatalabs/personal-server-ts-core"] =
                canaryVersion;
            }

            if (path === "packages/cli/package.json") {
              pkg.dependencies["@opendatalabs/personal-server-ts-core"] =
                canaryVersion;
              pkg.dependencies["@opendatalabs/personal-server-ts-lite"] =
                canaryVersion;
              pkg.dependencies["@opendatalabs/personal-server-ts-server"] =
                canaryVersion;
            }

            fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          }
          EOF
      - name: Publish core canary
        run: cd packages/core && npm publish --tag canary --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish lite canary
        run: cd packages/lite && npm publish --tag canary --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish server canary
        run: cd packages/server && npm publish --tag canary --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish facade canary
        run: cd packages/cli && npm publish --tag canary --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
