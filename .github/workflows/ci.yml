name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    # feat/stream-sync collects stacked PRs before it merges to main; without
    # this, those PRs merged with no test run.
    branches: [main, develop, feat/stream-sync]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:eslint
      - run: npm run format:check

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Build the SQLite 3.22.0 shell for the local database conformance row
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL -o sqlite.zip https://www.sqlite.org/2018/sqlite-amalgamation-3220000.zip
          unzip -q sqlite.zip
          gcc -O1 -DSQLITE_THREADSAFE=0 sqlite-amalgamation-3220000/shell.c sqlite-amalgamation-3220000/sqlite3.c -lm -ldl -o sqlite3-3.22.0
          echo "LOCALDB_SQLITE3_CLI=$RUNNER_TEMP/sqlite3-3.22.0" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
