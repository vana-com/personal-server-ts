# Moksha worker role. Render GIT_REF and PS_IMAGE as reviewed literals.
# Both workers must remain in the existing worker app/KMS domain.
# MCP env is unset for worker2; set it only on the existing migration source.
services:
  agent:
    image: node@sha256:4caaaf42195bcd6f6f3559a413b20cb8f8ad089e231ee874cf7701643966689f
    restart: unless-stopped
    stop_grace_period: 120s
    working_dir: /app
    ports:
      - 8787:8787
      - 8789:8789
    environment:
      - MCP_PUBLIC_ORIGIN
      - MCP_APPROVAL_URL
      - MCP_STATE_PATH=/mcp-state/state.sealed
      - MCP_INGRESS_HOST=0.0.0.0
      - MCP_INGRESS_PORT=8788
      - MCP_REDIRECT_URIS=["https://claude.ai/api/mcp/auth_callback","https://claude.com/api/mcp/auth_callback"]
      - ENCLAVE_AGENT_SECRET
      - ENCLAVE_AGENT_HOST=0.0.0.0
      - ENCLAVE_AGENT_PORT=8787
      - SANDBOX_DEBUG=1
      - GIT_REF
      - GATEWAY_URL=https://dp-rpc-moksha-spike-b3.vercel.app
      - STORAGE_API_URL=https://spikeb3-vana-storage.vana.workers.dev
      - CHAIN_ID=14800
      - NODE_ID
      - NODE_SECRET
      - FLEET_ENABLED=true
      - FLEET_PEER_PORT=8789
      - FLEET_PEER_POLICIES
      - SANDBOX_RUNTIME=docker
      - DOCKER_HOST=tcp://sandbox-runtime:2375
      - PS_IMAGE
      - SANDBOX_MAX=20
      - SANDBOX_MEMORY=512m
      - SANDBOX_CPUS=1
      - SANDBOX_IDLE_TTL_SECONDS=30
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - mcp-state:/mcp-state
    depends_on:
      sandbox-runtime:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        date -u +%FT%TZ
        apk add --no-cache docker-cli git
        : "$${PS_IMAGE:?PS_IMAGE must be set}"
        for pull_attempt in 1 2 3; do
          if docker pull "$$PS_IMAGE"; then
            break
          fi
          if [ "$$pull_attempt" -eq 3 ]; then
            echo "Failed to pull PS_IMAGE after 3 attempts: $$PS_IMAGE" >&2
            exit 1
          fi
          echo "Failed to pull PS_IMAGE (attempt $$pull_attempt of 3); retrying in 10 seconds" >&2
          sleep 10
        done
        : "$${GIT_REF:?GIT_REF must be a 40-hex commit SHA}"
        git init .
        if git remote get-url origin >/dev/null 2>&1; then
          git remote set-url origin https://github.com/vana-com/personal-server-ts
        else
          git remote add origin https://github.com/vana-com/personal-server-ts
        fi
        git fetch --depth 1 origin "$${GIT_REF}"
        git checkout --detach --force FETCH_HEAD
        resolved_ref="$$(git rev-parse HEAD)"
        if [ "$${resolved_ref}" != "$${GIT_REF}" ]; then
          echo "Checked out commit $${resolved_ref}, expected GIT_REF $${GIT_REF}" >&2
          exit 1
        fi
        npm ci --no-audit --no-fund
        date -u +%FT%TZ
        npm run build -w @opendatalabs/personal-server-ts-enclave
        date -u +%FT%TZ
        exec npm run start:agent -w @opendatalabs/personal-server-ts-enclave
  sandbox-runtime:
    image: docker@sha256:f649ef046008ca7f926a2571c32b0ac22e5c59eb61b959617f9acc2a4c638cf5
    restart: unless-stopped
    privileged: true
    cgroup: host
    environment:
      DOCKER_TLS_CERTDIR: ""
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        gvisor_release=20260817
        gvisor_sha512=bd8271a7742f90e53373b2a8613f37f3ae2c765ff5e2e611a75a47167a323cab7519b149c50273307743491713525a14ad1b3e398651c93b16f3e248dfeff3dd
        gvisor_url="https://storage.googleapis.com/gvisor/releases/release/$${gvisor_release}/x86_64"
        apk add --no-cache bzip2 coreutils curl iproute2 iptables
        cd /tmp
        curl -fsSLO "$${gvisor_url}/gvisor.tar.bz2"
        printf '%s  %s\n' "$${gvisor_sha512}" gvisor.tar.bz2 | sha512sum -c -
        tar -xjf gvisor.tar.bz2 -C /usr/local/bin
        # systrap avoids ptrace syscall overhead; keep runsc-ptrace for the agent constant.
        runsc install --runtime runsc-ptrace -- --platform=systrap
        runtime_host="$$(ip -4 addr show eth0 | awk '/inet / { sub(/\/.*/, "", $$2); print $$2; exit }')"
        if [ -z "$${runtime_host}" ]; then
          echo "Could not resolve the compose-network address; falling back to 0.0.0.0" >&2
          runtime_host=0.0.0.0
        fi
        # These rules deny nested sandboxes access to the unauthenticated Docker API.
        # --icc=false separately denies direct traffic between sandbox containers.
        iptables -I INPUT -i docker0 -p tcp --dport 2375 -j DROP
        iptables -I INPUT -i br-+ -p tcp --dport 2375 -j DROP
        exec dockerd --host="tcp://$${runtime_host}:2375" --host=unix:///var/run/docker.sock --tls=false --storage-driver=overlay2 --icc=false
    healthcheck:
      test:
        - CMD-SHELL
        - runtime_host="$$(ip -4 addr show eth0 | awk '/inet / { sub(/\/.*/, "", $$2); print $$2; exit }')" && test -n "$${runtime_host}" && docker --host="tcp://$${runtime_host}:2375" info
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 5s
volumes:
  mcp-state: null
