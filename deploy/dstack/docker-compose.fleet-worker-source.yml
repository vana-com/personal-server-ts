# Merge with docker-compose.fleet-worker.yml only for the existing MCP source.
# Preserve its original named volumes and app identity through export/rollback.
services:
  agent:
    environment:
      - MCP_PUBLIC_ORIGIN=https://mcp-dev.vana.org
      - MCP_APPROVAL_URL=https://vana-web-enclave-preview.vercel.app/personal-server
  mcp-tls:
    image: dstacktee/dstack-ingress:2.5@sha256:97285855a83ce6682447eb1f36e59c1927b9188a51b213e34d79acadd8425c78
    restart: unless-stopped
    ports:
      - 443:443
    environment:
      - CHALLENGE_TYPE=tls-alpn-01
      - DOMAIN=mcp-dev.vana.org
      - TARGET_ENDPOINT=agent:8788
      - GATEWAY_DOMAIN=_.dstack-pha-prod5.phala.network
      - DNS_SETUP_MODE=wait
      - DNS_SETUP_TIMEOUT=3600
      - EVIDENCE_SERVER=true
      - ALPN=http/1.1
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - mcp-certificates:/etc/letsencrypt
      - mcp-evidence:/evidences
volumes:
  mcp-certificates: null
  mcp-evidence: null
