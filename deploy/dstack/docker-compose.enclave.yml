# CVM
#  |
#  +-> agent [dstack.sock: enclave key] -- TCP 2375 --> sandbox-runtime
#                                                   [dind, privileged]
#                                                            |
#                                                            v
#                                                   gVisor sandboxes
#                                      [ps-<userPsId>-<epoch>, tmpfs /data,
#                                       no dstack or Docker sockets]
#
# PS_IMAGE must be a digest (vanaorg/personal-server@sha256:...) built from
# this branch's Dockerfile. The currently published digest fails at startup
# with ERR_MODULE_NOT_FOUND for @opendatalabs/vana-sdk.
services:
  agent:
    image: node:24-alpine
    restart: "no"
    working_dir: /app
    ports:
      - "8787:8787"
    environment:
      - ENCLAVE_AGENT_SECRET
      - ENCLAVE_AGENT_HOST=0.0.0.0
      - ENCLAVE_AGENT_PORT=8787
      - GIT_REF
      - GATEWAY_URL
      - NODE_ID
      - NODE_SECRET
      - SANDBOX_RUNTIME=docker
      - DOCKER_HOST=tcp://sandbox-runtime:2375
      - PS_IMAGE
      - SANDBOX_MAX
      - SANDBOX_IDLE_TTL_SECONDS
      - LEASE_SECONDS
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
    depends_on:
      sandbox-runtime:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        date -u +%FT%TZ
        apk add --no-cache docker-cli git
        git clone --depth 1 --branch "$${GIT_REF:-main}" https://github.com/vana-com/personal-server-ts .
        npm ci --no-audit --no-fund
        date -u +%FT%TZ
        npm run build -w @opendatalabs/personal-server-ts-enclave
        date -u +%FT%TZ
        exec npm run start:agent -w @opendatalabs/personal-server-ts-enclave

  sandbox-runtime:
    image: docker:27-dind
    restart: "no"
    privileged: true
    cgroup: host
    environment:
      DOCKER_TLS_CERTDIR: ""
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        gvisor_release=20260817
        gvisor_sha512=bd8271a7742f90e53373b2a8613f37f3ae2c765ff5e2e611a75a47167a323cab7519b149c50273307743491713525a14ad1b3e398651c93b16f3e248dfeff3dd
        gvisor_url="https://storage.googleapis.com/gvisor/releases/release/$${gvisor_release}/x86_64"
        apk add --no-cache bzip2 coreutils curl
        cd /tmp
        curl -fsSLO "$${gvisor_url}/gvisor.tar.bz2"
        printf '%s  %s\n' "$${gvisor_sha512}" gvisor.tar.bz2 | sha512sum -c -
        tar -xjf gvisor.tar.bz2 -C /usr/local/bin
        runsc install --runtime runsc-ptrace -- --platform=ptrace
        exec dockerd --host=tcp://0.0.0.0:2375 --host=unix:///var/run/docker.sock --tls=false --storage-driver=overlay2
    healthcheck:
      test: ["CMD", "docker", "--host=tcp://127.0.0.1:2375", "info"]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 5s
